<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>コラッツ予想 自動計算</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--fg:#1d2b25;--sub:#5d6b64;--line:#d5ddd8;--acc:#1f7a5a;--acc2:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#121815;--card:#1a221e;--fg:#e6eee9;--sub:#93a39a;--line:#2c3832;--acc:#4cc394;--acc2:#fb923c}}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.7}
.wrap{max-width:680px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px}
h1{font-size:1.4rem;margin:0 0 4px}
p.lead{margin:0 0 16px;color:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 180px;min-width:0;padding:10px;font-size:1rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button{padding:10px 18px;font-size:1rem;border:0;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.hidden{display:none}
.err{color:var(--acc2);min-height:1.5em;margin:6px 0 0;font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0}
.stat{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.stat b{display:block;font-size:1.25rem;overflow-wrap:anywhere}
.stat span{font-size:.8rem;color:var(--sub)}
svg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:6px}
.tablebox{max-height:320px;overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
th{position:sticky;top:0;background:var(--card)}
.note{font-size:.85rem;color:var(--sub);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1>コラッツ予想 自動計算</h1>
  <p class="lead">正の整数を入力すると、1になるまで計算します。偶数なら÷2、奇数なら×3+1。</p>
  <div class="row">
    <input type="text" id="start" inputmode="numeric" value="27" aria-label="開始する整数">
    <button id="calc">計算スタート</button>
  </div>
  <p class="err" id="calcErr" role="alert"></p>

  <div id="result" class="hidden">
    <div class="stats" id="stats"></div>
    <svg id="chart" viewBox="0 0 600 240" role="img" aria-label="値の推移グラフ"></svg>
    <p class="note">縦軸は対数目盛です。</p>
    <div class="tablebox"><table>
      <thead><tr><th>#</th><th>値</th><th>操作</th></tr></thead>
      <tbody id="rows"></tbody>
    </table></div>
    <p class="note" id="truncNote"></p>
  </div>
</div>

<script>
const MAX_STEPS = 100000;
const MAX_ROWS = 5000;
const $ = id => document.getElementById(id);

function collatz(n){
  const seq = [n], ops = ['開始'];
  let peak = n, odd = 0, even = 0;
  while (n > 1n && seq.length <= MAX_STEPS){
    if (n % 2n === 0n){ n /= 2n; even++; ops.push('÷2'); }
    else { n = n * 3n + 1n; odd++; ops.push('×3+1'); }
    seq.push(n);
    if (n > peak) peak = n;
  }
  return { seq, ops, peak, odd, even, done: n === 1n };
}

function log10Big(x){
  const s = x.toString();
  return s.length <= 15 ? Math.log10(Number(x))
       : (s.length - 16) + Math.log10(Number(s.slice(0,16)));
}

function drawChart(seq){
  const W=600,H=240,L=8,R=8,T=12,B=12;
  const ys = seq.map(log10Big);
  let max = 0.1; for (const y of ys) if (y > max) max = y;
  const stepX = (W-L-R) / Math.max(seq.length-1, 1);
  const pts = ys.map((y,i) => (L+i*stepX).toFixed(1)+','+(H-B-(y/max)*(H-T-B)).toFixed(1)).join(' ');
  $('chart').innerHTML = '<polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="1.6" stroke-linejoin="round"/>';
}

function run(){
  $('calcErr').textContent = '';
  const raw = $('start').value.trim().replace(/[,\s]/g,'');
  if (!/^[0-9]+$/.test(raw) || BigInt(raw) < 1n){
    $('calcErr').textContent = '1以上の正の整数を入力してください。';
    return;
  }
  const r = collatz(BigInt(raw));
  const steps = r.seq.length - 1;

  const items = [
    ['入力した値', raw],
    ['1になるまでの回数', steps + '回' + (r.done ? '' : '（上限で停止）')],
    ['最大値', r.peak.toString()],
    ['÷2 の回数 / ×3+1 の回数', r.even + ' / ' + r.odd]
  ];
  $('stats').replaceChildren(...items.map(([label, val]) => {
    const d = document.createElement('div'); d.className = 'stat';
    const b = document.createElement('b'); b.textContent = val;
    const s = document.createElement('span'); s.textContent = label;
    d.append(b, s); return d;
  }));

  drawChart(r.seq);

  const frag = document.createDocumentFragment();
  r.seq.slice(0, MAX_ROWS).forEach((v,i) => {
    const tr = document.createElement('tr');
    [i, v.toString(), r.ops[i]].forEach(t => {
      const td = document.createElement('td'); td.textContent = t; tr.appendChild(td);
    });
    frag.appendChild(tr);
  });
  $('rows').replaceChildren(frag);
  $('truncNote').textContent = r.seq.length > MAX_ROWS ? '表は最初の ' + MAX_ROWS + ' 行のみ表示しています。' : '';
  $('result').classList.remove('hidden');
}
$('calc').onclick = run;
$('start').addEventListener('keydown', e => { if (e.key === 'Enter') run(); });
</script>
</body>
</html>
